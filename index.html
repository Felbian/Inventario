<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard de inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F3EF;--surface:#fff;--ink:#1C2330;--mute:#5E6675;--line:#DCDFD7;--ok:#2F6B3E;--ok-bg:#DCEBDD;--mid:#8A5F00;--mid-bg:#F6E7B8;--low:#B02F20;--low-bg:#F7D9D4;--acc:#2F6F8F;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#151A22;--surface:#1E2530;--ink:#ECEFF4;--mute:#9AA3B2;--line:#323B49;--ok:#8FD19F;--ok-bg:#24402C;--mid:#E8BC4A;--mid-bg:#4A3B10;--low:#FF9A8B;--low-bg:#4D2420;--acc:#6DB3D6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 'Archivo',system-ui,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
h1{margin:0;font-weight:800;font-size:clamp(28px,5vw,40px);letter-spacing:-.02em;line-height:1.05}
.sub{color:var(--mute);margin:4px 0 0;font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);font-weight:600}
select,input[type=date],button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
button{cursor:pointer;font-weight:600}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#status{font-size:13px;color:var(--mute);min-height:20px;margin:6px 0 0}
#status.err{color:var(--low);font-weight:600}
section{margin-top:32px}
h2{font-size:20px;font-weight:800;margin:0 0 12px;letter-spacing:-.01em}
h2 small{font-weight:400;color:var(--mute);font-size:13px;margin-left:8px}
.empty{color:var(--mute);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:16px}
/* alertas */
.stores{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.store{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--low);border-radius:10px;padding:14px 16px}
.store.clear{border-left-color:var(--ok)}
.store header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.store h3{margin:0;font-size:18px;font-weight:800}
.store header span,.note{color:var(--mute);font-size:13px}
.chips{list-style:none;margin:12px 0 8px;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{background:var(--low-bg);color:var(--low);font-weight:600;border-radius:999px;padding:4px 12px;font-size:14px}
.okmsg{margin:12px 0 8px;color:var(--ok);font-weight:600}
.note{margin:0}
/* matriz */
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:600;white-space:nowrap}
thead th{font-weight:600;color:var(--mute);white-space:nowrap}
thead small{display:block;font-weight:400;font-size:11px}
tr:last-child td{border-bottom:0}
td.c{font-weight:800;min-width:48px}
td.ok{background:var(--ok-bg);color:var(--ok)}
td.mid{background:var(--mid-bg);color:var(--mid)}
td.low{background:var(--low-bg);color:var(--low)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:8px}
.legend b{display:inline-block;min-width:22px;text-align:center;border-radius:4px;margin-right:4px}
/* tendencias / conteo */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 14px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center}
.card h3{margin:0 0 6px 0;font-size:14px;font-weight:600;color:var(--mute)}
.val{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.val small{font-size:13px;font-weight:600;margin-left:6px}
.up{color:var(--ok)}.down{color:var(--low)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.lg{font-size:12px;color:var(--mute);margin-top:2px}
@media(max-width:520px){.filters,.filters label{width:100%}select{width:100%}}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div>
    <h1>Inventario</h1>
    <p class="sub">Cierre diario por tienda</p>
  </div>
  <div class="filters">
    <label>Tienda
      <select id="store"><option value="">Todas las tiendas</option></select>
    </label>
    <label>Fecha
      <input type="date" id="date">
    </label>
    <button id="reset" type="button">Ver todo</button>
    <button id="refresh" type="button" class="primary">Actualizar</button>
  </div>
</header>
<p id="status" role="status"></p>

<section id="alerts">
  <h2>Por reponer<small>Último cierre de cada tienda</small></h2>
  <div class="body"></div>
</section>

<section id="trends">
  <h2>Conteo de insumos<small>Evolución por cierre</small></h2>
  <div class="body"></div>
</section>

<section id="matrix">
  <h2>Nivel de insumos<small>Últimos 14 cierres</small></h2>
  <div class="body"></div>
</section>

</div>

<script>
/* ============ CONFIGURACIÓN ============ */
const CONFIG = {
  URL: 'https://script.google.com/macros/s/AKfycbwZmFTxKKKb5goq2QiBGiraAJ106gwb4Buj4iHSIaXB4ksU9vX12l4-WBz-CN0plFIR8w/exec',   // termina en /exec
  TOKEN: ''                      // el mismo TOKEN del script ('' si no usas)
};
/* ======================================= */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const fd = d => d.toLocaleDateString('es-CO', {day:'numeric', month:'short'}).replace('.', '');
const lvl = v => { v = (v||'').toLowerCase().trim(); return v.startsWith('muy') ? 'low' : v.startsWith('suf') ? 'ok' : v.startsWith('norm') ? 'mid' : ''; };
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const pick = (t, w) => { const m = String(t).match(new RegExp(w + '\\s*:?\\s*\\$?\\s*([\\d.,]+)', 'i')); return m ? parseInt(m[1].replace(/[.,]/g, ''), 10) : null; };
const COLORS = ['#2F6F8F', '#7A4FA3', '#B07A00', '#3F7D4E', '#B02F20'];
const M = {counts: [], quals: [], recs: [], stores: []};

/* --- Carga de datos --- */
function load() {
  return new Promise((res, rej) => {
    const cb = 'cb' + Date.now(), s = document.createElement('script');
    const t = setTimeout(() => { end(); rej(new Error('Sin respuesta. Revisa la URL, que el acceso sea "Cualquier persona" y el token.')); }, 20000);
    function end() { clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { end(); res(d); };
    s.onerror = () => { end(); rej(new Error('No se pudo conectar con Apps Script.')); };
    s.src = CONFIG.URL + '?token=' + encodeURIComponent(CONFIG.TOKEN) + '&callback=' + cb + '&_=' + Date.now();
    document.head.appendChild(s);
  });
}

/* --- Interpretar columnas y filas --- */
function build(d) {
  const H = d.headers;
  const kF = H.find(h => /fecha de hoy/i.test(h)), kT = H.find(h => /selecciona la tienda/i.test(h)), kO = H.find(h => /^observaciones/i.test(h));
  M.counts = []; M.quals = [];
  H.forEach(h => {
    if (/^¿Cu[aá]nt/i.test(h)) {
      let l = h.replace(/^¿Cu[aá]nt\S*\s+/i, '').replace(/\s*tienes\?$/i, '').replace(/^(tarros|bolsas|paquetes|cajas) de\s+/i, '');
      M.counts.push({k: h, label: l.charAt(0).toUpperCase() + l.slice(1)});
    } else if (/^Selecciona cuanta cantidad/i.test(h)) {
      const m = h.match(/\[(.*?)\]\s*$/); let l = (m ? m[1] : h).trim();
      if (/salsas/i.test(h) && !/^salsa/i.test(l)) l = 'Salsa ' + l.charAt(0).toLowerCase() + l.slice(1);
      M.quals.push({k: h, label: l});
    }
  });
  const by = new Map();
  d.rows.forEach(r => {
    const m = String(r[kF] || r[H[0]] || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (!m) return;
    const date = new Date(+m[3], +m[2]-1, +m[1]), store = String(r[kT] || 'Sin tienda').trim(), obs = r[kO] || '';
    by.set(store + iso(date), {date, store, r, ventas: pick(obs, 'ventas'), efectivo: pick(obs, 'efectivo')});
  });
  M.recs = [...by.values()].sort((a, b) => a.date - b.date || a.store.localeCompare(b.store));
  M.stores = [...new Set(M.recs.map(x => x.store))].sort();
}

function fillFilters() {
  const sel = $('#store'), cur = sel.value;
  sel.innerHTML = '<option value="">Todas las tiendas</option>' + M.stores.map(s => `<option>${esc(s)}</option>`).join('');
  sel.value = M.stores.includes(cur) ? cur : '';
  if (M.recs.length) {
    $('#date').min = iso(M.recs[0].date);
    $('#date').max = iso(M.recs[M.recs.length-1].date);
  }
}

const view = () => {
  const s = $('#store').value, d = $('#date').value;
  return M.recs.filter(x => (!s || x.store === s) && (!d || iso(x.date) === d));
};
const empty = (id, msg) => { $('#' + id + ' .body').innerHTML = `<div class="empty">${msg}</div>`; };

const REGLAS_REPOSICION = {
  // Reglas por defecto para cualquier tienda no especificada
  '*': {
    'Napolitana': 1,
    'Chile con carne': 3,
    'Maicitos': 4,
    'Frijoles refritos': 3,
    'Aceite de oliva': 1,
  },
  // Reglas específicas para la tienda "Plaza 111"
  'Plaza 111': {
    'Salchichas': 50,
    'Panes': 50,
    'Queso mozarella': 1,
    'Tocineta': 1,
    
  },
  // Reglas para la tienda "Natura"
  'Natura': {
    'Pan': 8,
    'Salsa': 1,
    'Queso': 4
  },
  // Reglas para la tienda "Vivero"
  'Vivero': {
    'Pan': 12,
    'Queso': 6
  }
};
/* ======================================= */

/* --- Por reponer (Con filtros de stock mínimo y niveles de alerta) --- */
function renderAlerts(v) {
  const last = new Map(); 
  v.forEach(x => last.set(x.store, x));
  
  let h = '';
  
  last.forEach(x => {
    // 1. Alertas Cualitativas (Marcadas como 'Muy poco')
    const lowQuals = M.quals
      .filter(q => lvl(x.r[q.k]) === 'low')
      .map(q => ({ label: q.label, motivo: 'Nivel bajo' }));

    // 2. Alertas Cuantitativas (Conteo numérico <= Mínimo permitido)
    const reglasTienda = REGLAS_REPOSICION[x.store] || REGLAS_REPOSICION['*'] || {};
    const lowCounts = [];

    M.counts.forEach(c => {
      const cantidad = num(x.r[c.k]);
      if (cantidad === null) return;

      // Buscar si el producto tiene una regla de mínimo configurada
      const minimoConfigurado = Object.entries(reglasTienda).find(([key]) => 
        c.label.toLowerCase().includes(key.toLowerCase())
      );

      if (minimoConfigurado) {
        const [nombreRegla, minVal] = minimoConfigurado;
        if (cantidad <= minVal) {
          // Evitar duplicar si ya fue incluido en la evaluación cualitativa
          const yaExiste = lowQuals.some(q => q.label.toLowerCase() === c.label.toLowerCase());
          if (!yaExiste) {
            lowCounts.push({
              label: `${c.label} (${cantidad} rest. / mín: ${minVal})`,
              motivo: 'Stock bajo'
            });
          }
        }
      }
    });

    // Combinar ambos tipos de alertas
    const todasAlertas = [...lowQuals, ...lowCounts];
    const totalLow = todasAlertas.length;
    const midCount = M.quals.filter(q => lvl(x.r[q.k]) === 'mid').length;

    h += `<article class="store ${totalLow ? '' : 'clear'}">
      <header>
        <h3>${esc(x.store)}</h3>
        <span>Cierre del ${fd(x.date)}</span>
      </header>` +
      (totalLow 
        ? `<ul class="chips">${todasAlertas.map(item => `<li>${esc(item.label)}</li>`).join('')}</ul>` 
        : '<p class="okmsg">Inventario en orden (Sin faltantes).</p>') +
      `<p class="note">${totalLow} para reponer · ${midCount} en nivel normal</p>
    </article>`;
  });

  if (!h) return empty('alerts', 'No hay datos de cierres para las tiendas seleccionadas.');
  $('#alerts .body').innerHTML = `<div class="stores">${h}</div>`;
}
/* --- Conteo de insumos (centrado y sin punto SVG) --- */
function renderTrends(v) {
  const dates = [...new Set(v.map(x => iso(x.date)))], stores = [...new Set(v.map(x => x.store))];
  let h = '';
  M.counts.forEach(c => {
    const ser = stores.map((s, si) => ({s, si, pts: v.filter(x => x.store === s).map(x => ({i: dates.indexOf(iso(x.date)), v: num(x.r[c.k])})).filter(p => p.v !== null)})).filter(s => s.pts.length);
    if (!ser.length) return;
    
    let top;
    if (ser.length === 1) {
      const p = ser[0].pts, l = p[p.length-1].v, d = p.length > 1 ? l - p[p.length-2].v : null;
      top = `<div class="val">${l}${d ? `<small class="${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'}${Math.abs(d)}</small>` : ''}</div>`;
    } else {
      top = `<div class="lg">${ser.map(s => `<span class="dot" style="background:${COLORS[s.si % COLORS.length]}"></span>${esc(s.s)}: <b>${s.pts[s.pts.length-1].v}</b>`).join(' &nbsp; ')}</div>`;
    }
    h += `<div class="card"><h3>${esc(c.label)}</h3>${top}</div>`;
  });
  if (!h) return empty('trends', 'No hay conteos registrados en este periodo.');
  $('#trends .body').innerHTML = `<div class="grid">${h}</div>`;
}

/* --- Semáforo (Nivel de insumos) --- */
function renderMatrix(v) {
  const cols = v.slice(-14), multi = M.stores.length > 1 && !$('#store').value, g = {ok: '✓', mid: '–', low: '!'}, names = {ok: 'Suficiente', mid: 'Normal', low: 'Muy poco'};
  const rows = M.quals.filter(q => cols.some(x => lvl(x.r[q.k])))
    .map(q => ({q, low: cols.filter(x => lvl(x.r[q.k]) === 'low').length, mid: cols.filter(x => lvl(x.r[q.k]) === 'mid').length}))
    .sort((a, b) => b.low - a.low || b.mid - a.mid || a.q.label.localeCompare(b.q.label));
  if (!rows.length) return empty('matrix', 'No hay niveles registrados en este periodo.');
  $('#matrix .body').innerHTML = `<div class="scroll"><table><thead><tr><th>Insumo</th>${cols.map(x => `<th>${fd(x.date)}${multi ? `<small>${esc(x.store)}</small>` : ''}</th>`).join('')}</tr></thead><tbody>` +
    rows.map(({q}) => `<tr><td>${esc(q.label)}</td>${cols.map(x => { const l = lvl(x.r[q.k]); return l ? `<td class="c ${l}" title="${names[l]}">${g[l]}</td>` : '<td></td>'; }).join('')}</tr>`).join('') +
    `</tbody></table></div><div class="legend"><span><b class="ok" style="background:var(--ok-bg);color:var(--ok)">✓</b>Suficiente</span><span><b style="background:var(--mid-bg);color:var(--mid)">–</b>Normal</span><span><b style="background:var(--low-bg);color:var(--low)">!</b>Muy poco</span></div>`;
}

function render() {
  const v = view();
  if (!v.length) { ['alerts', 'trends', 'matrix'].forEach(id => empty(id, 'No hay cierres para esta tienda y fecha. Prueba con otro filtro.')); return; }
  renderAlerts(v); renderTrends(v); renderMatrix(v);
}

async function go() {
  const st = $('#status');
  st.className = '';
  if (CONFIG.URL.startsWith('PEGA_AQUI')) { st.className = 'err'; st.textContent = 'Falta configurar CONFIG.URL con la URL /exec de Apps Script (al inicio del script).'; return; }
  st.textContent = 'Cargando datos…';
  try {
    const d = await load();
    if (!d || d.error || !d.rows) throw new Error(d && d.error ? d.error : 'Respuesta inesperada del script.');
    build(d); fillFilters(); render();
    st.textContent = 'Actualizado a las ' + new Date().toLocaleTimeString('es-CO', {hour: '2-digit', minute: '2-digit'}) + ' · ' + M.recs.length + ' cierres';
  } catch (e) { st.className = 'err'; st.textContent = e.message; }
}

['store', 'date'].forEach(id => $('#' + id).addEventListener('change', render));
$('#reset').onclick = () => { $('#store').value = $('#date').value = ''; render(); };
$('#refresh').onclick = go;
go();
</script>
</body>
</html>
